<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const ST={study:'学力',sport:'体力',art:'直感',charm:'魅力'};
const SEA=m=>m>=3&&m<=5?['#5b3a66','#c98fa6']:m>=6&&m<=8?['#1f4a66','#6fb0c4']:m>=9&&m<=11?['#5a3320','#d19a5c']:['#1f2c46','#8fa3c7'];
const PERKS=[['grow','成長の心得','能力の上昇量が毎回+1'],['stamina','鉄の体力','鍛えても疲れにくくなる'],['aura','モテオーラ','周回開始時、全員の好感度+10'],['date','デートの達人','デートの好感度+2'],['genius','秀才の記憶','定期テストの基準が下がる'],['lucky','出会い運','出会いイベントが起きやすい']];
const APPS_ALL=[['msg','話','メッセージ','#3f8f6b'],['ppl','縁','連絡先','#b0566e'],['cal','暦','カレンダー','#c68a3a'],['me','力','ステータス','#4a6fa5'],['ach','績','実績','#d97706'],['grp','見','見守る会','#16a34a'],['fc','会','ファン会','#e11d74'],['alb','絵','アルバム','#8b5cf6'],['sf','撮','自撮り','#ec4899'],['let','文','手紙','#f43f5e'],['end','結','結末','#0ea5e9'],['hs','奉','ご奉仕','#f97316'],['nv','章','特別章','#0891b2'],['sp','専','専用','#b45309'],['jz','誓','嫉妬ゼロ','#db2777'],['np','報','新聞','#b45309'],['mn','独','独白','#be185d'],['og','隊','親衛隊','#4f46e5'],['cos','着','着せ替え','#f472b6'],['duty','係','専属係','#0d9488'],['pin','球','ピンボール','#7c3aed'],['inbox','届','通知','#e11d74'],['tick','券','お願い券','#f59e0b'],['rep','評','評判','#0ea5e9'],['gv','密','女子会','#a855f7'],['set','設','設定','#6b7280']];
/* 整理: 重複していた「学園新聞(news)」「心の声(mono)」は非表示(新聞/独白に統一)。ホームは主要アプリのみ、残りは「その他」フォルダへ */
const APPS_MORE_KEYS=['sf','cos','end','nv','sp','jz','duty','pin','inbox','tick','rep','gv'];
const APPS=APPS_ALL.filter(a=>!APPS_MORE_KEYS.includes(a[0])).concat([['more','他','その他','#64748b']]);
const APPS_MORE=APPS_ALL.filter(a=>APPS_MORE_KEYS.includes(a[0]));
const TTL={msg:'メッセージ',ppl:'連絡先',cal:'カレンダー',me:'ステータス',ach:'実績',grp:'見守る会',fc:'ファンクラブ',duty:'専属係',alb:'アルバム',sf:'自撮り',let:'手紙',end:'結末',hs:'ご奉仕',nv:'特別章',news:'学園新聞',sp:'専用スペース',mono:'女子の心の声',jz:'嫉妬ゼロ宣言',np:'学園新聞',mn:'女子の独白',og:'親衛隊と専用スペース',cos:'着せ替え',pin:'ピンボール',set:'設定'};
const KEY='sakuragaoka2';
let CROWD=null,S=null,met=new Set(),Q=[],PA='',PN='',NOTE='',DP=null,CFG={bgm:.5,se:.6};

const H=id=>HEROINES.find(h=>h.id===id),
 avail=()=>HEROINES.filter(h=>h.rand?!!S.got[h.id]:S.loop>=h.loop&&S.t>=h.from),
 mon=()=>(S.t+3)%12+1,yr=()=>Math.floor(S.t/12)+1,cap=()=>100+S.loop*40,p=k=>S.perks[k]||0,
 add=(k,d)=>{const v=S.a[k]=Math.max(0,Math.min(100,(S.a[k]||0)+d));if(d>0&&typeof HB==='number')HB=Math.min(12,HB+Math.ceil(d/2));return v},
 ensure=()=>{setSchoolName(S.ps||DEF_SCHOOL,1);if(S.pn)setPlayerName(S.pn[0],S.pn[1]);else setPlayerName(DEF_NAME[0],DEF_NAME[1]);S.perks=S.perks||{};S.clear=S.clear||{};S.seen=S.seen||{};S.a=S.a||{};S.got=S.got||{};S.nm=S.nm||{};if(S.ap==null)S.ap=4;
  if(S.money==null)S.money=START_MONEY;S.items=S.items||{};S.cnt=S.cnt||{};S.ach=S.ach||{};S.mo=S.mo||{};S.moN=S.moN||0;
  /* 最初の3人などの固定ヒロインは START_FAV の範囲でランダム。抽選で出会う子は、出会う瞬間に rollNew が決める */
  HEROINES.forEach(h=>{if(!h.rand&&S.a[h.id]==null)S.a[h.id]=R(START_FAV[0],START_FAV[1])});
  avail().forEach(h=>{if(!S.mo[h.id])S.mo[h.id]=++S.moN})},
 st=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
 ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
 save=()=>st(KEY,S),
 bar=(v,m)=>`<i class="bar" style="--w:${Math.min(100,v/m*100)}%"></i>`;

/* 画像(img/番号.jpg)。無いときは名字の仮表示 */
function pic(h){return `<div class="pic" style="--c:${h.c}"><span>${h.n.split(' ')[0]}</span><img src="img/${h.img}.jpg" alt="${h.n}" width="252" height="352" loading="lazy" decoding="async" onerror="this.remove()"></div>`}

/* 音 */
let AC=null,BG=null;
function se(){if(CFG.se<=0)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.07*CFG.se;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.12);o.stop(AC.currentTime+.12)}catch(e){}}
function vol(){if(BG)BG.volume=CFG.bgm}
function bgm(){if(BG)return;BG=new Audio('snd/bgm.mp3');BG.loop=true;BG.volume=CFG.bgm;BG.play().catch(()=>{})}
document.addEventListener('click',e=>{if(e.target.closest('button'))se();bgm()});
CFG=ld('sakuragaoka_cfg')||CFG;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e});

/* 画面 */
function side(){
 const el=$('#side');
 if(!S){el.innerHTML='<h2>あそびかた</h2><small>毎月4週ぶんの行動力があり、1週ごとに勉強・運動・散策・バイトなどを選べる。能力が高いほど、新しい出会いも増える。魅力は女子と触れ合うたびに、直感はイベントに積極的に参加するたびに上がる。バイトで稼いだお金は、ショップで使える。3年間で好きな子との好感度を育てよう。卒業後は特典を選んで、強くてニューゲームへ。</small>';$('#date').textContent='';$('#loop').textContent='';return}
 $('#loop').textContent=`${S.loop+1}周目`;$('#date').textContent=S.fin?'卒業':`${yr()}年目 ${mon()}月`;
 const [a,b]=SEA(S.fin?3:mon());document.documentElement.style.setProperty('--s1',a);document.documentElement.style.setProperty('--s2',b);
 document.body.dataset.hs=lifeStage();
 el.innerHTML=`<h2>通り名</h2><div class="ttl">${moteTitle().name}</div><h2>行動力</h2><div class="ap">${[0,1,2,3].map(i=>`<i class="${i<S.ap?'on':''}"></i>`).join('')}<b>${S.ap}/4</b></div><h2>能力</h2>`
 +Object.entries(ST).map(([k,l])=>`<div class="st"><span>${l}</span>${bar(S.st[k],cap())}<b>${S.st[k]}</b></div>`).join('')+`<div class="st"><span>疲れ</span>${bar(S.f,10)}<b>${S.f}</b></div><div class="money"><span>所持金</span><b>${yen(S.money)}</b></div><h2 style="margin-top:18px">女性一覧</h2>${listCtl('side')}<div class="lst" data-lbody="side">${listBody('side',rowSide)}</div>`;
}
/* 画像の先読み: 背景(タイトル/メニュー/12か月)を起動時に読み込み、顔画像は出会い済みの子を暇なときに読み込む。
   読み込めなかった背景は BGNG に記録し、毎回404を出さずに次の候補へ進む。 */
const BGOK={},BGNG={},FACEW={};
function warmImg(src,rec){const i=new Image();i.decoding='async';if(rec){i.onload=()=>{BGOK[src]=1};i.onerror=()=>{BGNG[src]=1}}i.src=src}
function warmBg(){try{const b=GAME.bg;[b.title,b.menu].forEach(u=>u&&warmImg(u,1));for(let m=1;m<=12;m++)warmImg(b.month.replace('{MM}',String(m).padStart(2,'0')),1)}catch(e){}}
function warmFaces(){if(!S||!S.a)return;const idle=window.requestIdleCallback||(f=>setTimeout(f,200));
 idle(()=>{Object.keys(S.a).forEach(id=>{if(FACEW[id])return;FACEW[id]=1;const h=H(id);if(h&&h.img)warmImg('img/'+h.img+'.jpg')})})}
warmBg();
function show(k,t,b){
 const h=k&&H(k);
 $('#who').textContent=h?h.n:'';$('#who').hidden=!h;$('#msg').textContent=t;
 let sc=$('#scene'),mm=S?(S.fin?3:mon()):0,bs=S?[GAME.bg.month.replace('{MM}',String(mm).padStart(2,'0')),GAME.bg.menu]:[GAME.bg.title,GAME.bg.menu];
 bs=bs.filter((u,i)=>!BGNG[u]||i===bs.length-1);if(bs.length<2)bs.push('');sc.className=h?'hp':'';
 const chip=S?(S.fin?'<span class="mlabel">卒業</span>':`<span class="mlabel">${mm}月<small>第${Math.min(4,5-S.ap)}週</small><em>${'●'.repeat(S.ap)}${'○'.repeat(4-S.ap)}</em></span>`):'',
  pt=[0,1,2,3,4,5,6].map(i=>`<i class="pt" style="left:${6+i*14}%;animation-duration:${9+i%3*3}s;animation-delay:${-i*1.7}s"></i>`).join('');
 sc.innerHTML=`<img class="bg" src="${bs[0]}" data-f="${bs[1]}" alt="" onload="this.parentNode.classList.add('hasbg')" onerror="var f=this.dataset.f;if(f){this.dataset.f='';this.src=f}else this.remove()">`+pt+(h?pic(h).replace('loading="lazy"','loading="eager"'):`<div class="big">${S&&!S.fin?mon()+'月':'桜'}</div>`)+chip+(CROWD?crowdHtml(CROWD):(S&&!S.fin?peekHtml():''))+(S&&!S.fin?heartHtml():'');
 warmFaces();
 const bt=$('#btns');bt.innerHTML='';
 b.forEach(([l,f,c,ic])=>{
  const e=document.createElement('button');e.type='button';if(c)e.className=c;
  if(ic){const i=document.createElement('i');i.className='ic';i.textContent=ic;e.append(i)}
  const [t1,...t2]=l.split('\n'),bb=document.createElement('b');bb.textContent=t1;e.append(bb);
  if(t2.length){const sm=document.createElement('small');sm.textContent=t2.join('\n');e.append(sm)}
  e.onclick=f;bt.append(e);
 });
 side();
}

/* ===== 主人公の名前 ===== 姓・名を GAME に反映します(S がある間はセーブデータ S.pn にも残ります) */
function cleanName(v){return String(v||'').replace(/[<>&"'`\\]/g,'').trim().slice(0,12)}
function setSchoolName(v,quiet){
 v=cleanName(v).slice(0,12);if(!v)v=DEF_SCHOOL;
 GAME.school=v;if(S)S.ps=v;if(!quiet)st('sakuragaoka_school',v);
}
function setPlayerName(f,g){
 f=cleanName(f).slice(0,6);g=cleanName(g).slice(0,6);
 if(!f&&!g){f=DEF_NAME[0];g=DEF_NAME[1]}
 GAME.family=f;GAME.given=g;GAME.player=f+g;GAME.nick=(f||g)+'くん';
 if(S)S.pn=[f,g];
 st('sakuragaoka_name',[f,g]);
}
/* ゲーム開始直後に出す名前の入力画面。ok(姓,名) が呼ばれます */
function nameDialog(ok){
 const sl=ld('sakuragaoka_school');
 const d=document.createElement('div');d.id='nmd';
 let last=ld('sakuragaoka_name');if(!Array.isArray(last))last=DEF_NAME;
 d.innerHTML=`<form class="nmc"><h2>あなたの名前は？</h2><p>女子たちには「<b id="nmp"></b>」と呼ばれます。</p><div class="nmr"><label>姓<input id="nmf" maxlength="6" value="${last[0]}" autocomplete="off"></label><label>名<input id="nmg" maxlength="6" value="${last[1]}" autocomplete="off"></label></div><label class="nms">学園名<input id="nms" maxlength="12" value="${sl||DEF_SCHOOL}" autocomplete="off"></label><div class="nmb"><button type="button" id="nmd0">初期の名前にする</button><button type="submit" class="p">この名前ではじめる</button></div></form>`;
 document.body.append(d);
 const f=d.querySelector('#nmf'),g=d.querySelector('#nmg'),pv=()=>d.querySelector('#nmp').textContent=((f.value.trim()||g.value.trim()||DEF_NAME[0]))+'くん';
 pv();f.oninput=g.oninput=pv;
 d.querySelector('#nmd0').onclick=()=>{f.value=DEF_NAME[0];g.value=DEF_NAME[1];d.querySelector('#nms').value=DEF_SCHOOL;pv()};
 d.querySelector('form').onsubmit=e=>{e.preventDefault();const sv=d.querySelector('#nms').value;d.remove();ok(f.value,g.value,sv)};
 f.focus();f.select();
}
/* 進行(1か月=4週。毎週1回行動し、行動力4を使い切ると月末のイベントへ) */
function title(){
 S=null;const sv=ld(KEY),b=[['はじめから',start,'act p','✦']];
 if(sv&&typeof sv.t==='number')b.push(['つづきから',()=>{S=sv;met=new Set();ensure();S.fin?fin(S.fin.kind,S.fin.k):menu()},'act','▶']);
 show('','3年間の高校生活で、あなたは誰と卒業式を迎える？\n能力を磨き、出会いを重ね、桜の丘での告白をめざそう。',b);
}
function start(){
 nameDialog((f,g,sc)=>start2(f,g,sc));
}
function start2(f,g,sc){
 S={t:0,loop:0,ap:4,st:{study:20,sport:20,art:20,charm:20},f:0,a:{},perks:{},clear:{},seen:{},got:{},nm:{},fin:null};NOTE='';met=new Set();setPlayerName(f,g);setSchoolName(sc||DEF_SCHOOL);ensure();
 const ns=avail().filter(h=>!S.seen[h.id]);ns.forEach(h=>S.seen[h.id]=1);
 /* 導入と最初の出会いを1続きにして、スキップ1回で全部飛ばせるようにする */
 Novel.play(['opening',...ns.map(h=>'meet_'+h.id)],{},menu);
}
function menu(){
 ensure();const ns=avail().filter(h=>!S.seen[h.id]);
 if(ns.length){ns.forEach(h=>S.seen[h.id]=1);return Novel.play(ns.map(h=>'meet_'+h.id),{},menu)}
 if(S.ap<=0)return encounter();
 if(morningMaybe(menu))return;
 save();const nt=NOTE;NOTE='';
 show('',`${nt?nt+'\n':''}${yr()}年目の${mon()}月 第${5-S.ap}週。今週は何をしよう？\n（行動力 残り${S.ap}　所持金 ${yen(S.money)}）`,[
  ['勉強する\n学力が上がる',()=>act('study'),'act','📖'],
  ['運動する\n体力が上がる',()=>act('sport'),'act','🏃'],
  ['散策する\n新しい出会いが増える',()=>act('walk'),'act','🌸'],
  ['ゆっくり休む\n疲れを回復',()=>act('rest'),'act','☕'],
  ['バイト\n働いてお金を稼ぐ',()=>baito(),'act','💴'],
  ['ショップに行く\n買い物は行動力を使わない',()=>shop(),'act','🛍️'],
  [`号令をかける\n女子を集める（${haremN()}/${HAREM_NEED}人）${haremRank()?'・'+haremRank():''}`,gather,haremN()>=HAREM_NEED?'act':'act off','📣'],
  [`スマホを見る\n${chatBadge()?'見守る会 未読'+chatBadge()+'件':'連絡・デート・ピンボール'}`,openPhone,'act p','📱']]);
}
function next(k,m,a){show(k,m,[['つぎへ',()=>weekEnd(a),'p']])}
/* 能力を n 上げる(上限 cap())。実際に上がった量を返す。魅力=女子との触れ合い1回につき+1、直感=イベントへの積極参加で+1 */
function gainSt(k,n){const b=S.st[k];S.st[k]=Math.min(cap(),b+n);return S.st[k]-b}
function act(k){
 let m;S.ap--;noteAct(k==='art'?'study':k);
 if(k==='rest'){S.f=Math.max(0,S.f-3);m='ゆっくり休んだ。疲れがとれた。'}
 else if(k==='walk'){
  /* 散策は能力が上がらない代わりに、新しい出会いの抽選が+15%になる(rollNew) */
  if(Math.random()>=Math.min(.8,.35*p('stamina')))S.f=Math.min(10,S.f+1);
  m='街をぶらぶら歩いて、いろんな人とすれ違った。\nどこかで新しい出会いがあるかもしれない。'+(S.f>=7?'\n疲れがたまっている。休むのも大切だ。':'');
 }
 else{
  const g=Math.max(1,Math.round((R(1,2)+p('grow'))*(S.f>=7?.5:1)));S.st[k]=Math.min(cap(),S.st[k]+g);
  if(Math.random()>=Math.min(.8,.35*p('stamina')))S.f=Math.min(10,S.f+1);
  m=`${ST[k]}が${g}上がった。`+(S.f>=7?'\n疲れがたまり、効率が落ちている。休むのも大切だ。':'');
 }
 next('',m,k);
}
function date(k,l,g){
 S.ap=Math.max(0,S.ap-2);
 const h=H(k),x=g+Math.floor(S.st[h.like]/30)+(S.st.charm>=40?2:0)+2*p('date');let jel=false;
 add(k,x);met.add(k);noteAct('date',h.n);S.f=Math.min(10,S.f+1);const gc=gainSt('charm',1);
 avail().forEach(o=>{if(o.id!==k&&S.a[o.id]>=50){add(o.id,-2);jel=true}});
 const dt=dateTalk(k);
 next(k,`${l}。穏やかな時間が流れた。`+(dt?'\n'+dt:'')+(gc?'\n魅力が1上がった。':'')+(jel?'\n（このうわさは、ほかの子の耳にも届いたようだ…）':''),'date');
}
/* 週の終わり: 新しい出会いの抽選 → 行動力が残っていれば次の週、なければ月末イベント */
function weekEnd(a){
 const g=rollNew(a),go=()=>{save();S.ap>0?menu():encounter()},
  chk=()=>{const o=checkAch();o.length?show('','🏆 実績解除！\n'+o.join('\n'),[['つぎへ',go,'p']]):go()},
  ach0=()=>{weekExtra(chk)},ach=()=>{(a==='walk'&&introduce(ach0))||ach0()};
 if(g)return Novel.play('meet_'+g.id,{h:g.id},()=>{const v=S.a[g.id];
  show(g.id,`${g.n}と知り合った！\n第一印象：${v>=60?'とても好印象！':v>=40?'なかなか好印象':'ふつうの印象'}`,[['つぎへ',ach,'p']])});
 ach();
}
/* 新キャラとの出会い。確率は4能力の平均が高いほど上がり(散策で+15%)、
   得意能力が req 以上の子だけが候補。得意能力が高い子ほど選ばれやすい。この抽選で出会えるのは1年に YEAR_CAP 人まで。
   出会ったときの好感度は randFav(魅力)(最低20。魅力が高いと最初から50以上もあり得る。heroines2.js) */
function rollNew(a){
 const y=yr();if((S.nm[y]||0)>=YEAR_CAP)return null;
 const v=S.st,avg=(v.study+v.sport+v.art+v.charm)/4,pr=Math.min(.9,.06+avg/400+(a==='walk'?.15:0));
 if(Math.random()>=pr)return null;
 const pool=HEROINES.filter(h=>h.rand&&!S.got[h.id]&&S.loop>=h.loop&&v[h.like]>=h.req);
 if(!pool.length)return null;
 const w=pool.map(h=>1+v[h.like]/20);let t=Math.random()*w.reduce((x,y)=>x+y,0),g=pool[pool.length-1];
 for(let i=0;i<pool.length;i++){t-=w[i];if(t<0){g=pool[i];break}}
 const base=randFav(v.charm),old=S.a[g.id];S.a[g.id]=old!=null?Math.max(old,base):base;
 S.got[g.id]=1;S.seen[g.id]=1;S.nm[y]=(S.nm[y]||0)+1;if(!S.mo[g.id])S.mo[g.id]=++S.moN;return g;
}

const HEX=[['sport','体力'],['study','学力'],['money','財力'],['charm','魅力'],['social','社交'],['lust','愛欲']];
function hexSvg(s){
 s=s||{};const c=130,r=84,v=k=>s[k]==null?50:s[k],
  pt=(i,k)=>{const a=-Math.PI/2+i*Math.PI/3;return [c+Math.cos(a)*r*k,c+Math.sin(a)*r*k]},
  f=a=>a[0].toFixed(1)+','+a[1].toFixed(1),poly=k=>HEX.map((_,i)=>f(pt(i,k))).join(' ');
 return `<svg class="hx" viewBox="0 0 260 260" role="img" aria-label="ステータス六角形グラフ">`
  +[.25,.5,.75,1].map(k=>`<polygon class="gl" points="${poly(k)}"/>`).join('')
  +HEX.map((_,i)=>{const q=pt(i,1);return `<line class="gl" x1="${c}" y1="${c}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}"/>`}).join('')
  +`<polygon class="pg" points="${HEX.map(([k],i)=>f(pt(i,Math.max(.04,v(k)/100)))).join(' ')}"/>`
  +HEX.map(([k],i)=>{const q=pt(i,Math.max(.04,v(k)/100));return `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3"/>`}).join('')
  +HEX.map(([k,l],i)=>{const q=pt(i,1.3);return `<text x="${q[0].toFixed(1)}" y="${q[1].toFixed(1)}" text-anchor="middle">${l}</text><text class="v" x="${q[0].toFixed(1)}" y="${(q[1]+14).toFixed(1)}" text-anchor="middle">${v(k)}</text>`}).join('')
  +'</svg>';
}
